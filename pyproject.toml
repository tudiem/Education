[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eduq"
version = "0.1.0"
description = "Kho bài tập cho giáo viên: nhập từ Word (MathType) → lưu → xuất"
requires-python = ">=3.11"
dependencies = ["lxml>=5", "olefile>=0.47", "sqlalchemy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eduq = "eduq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
